[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sn-ml"
version = "0.1.0"
description = "Lightweight personalized tonic sol-fa OCR research project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.3",
    "Pillow>=10.0",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
